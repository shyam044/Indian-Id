<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Vault</title>
    <!-- PWA Essentials -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgdmlld0JveD0iMCAwIDE5MiAxOTIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxOTIiIGhlaWdodD0iMTkyIiBmaWxsPSIjNjY3ZWVhIi8+CjxwYXRoIGQ9Ik0xNCAxNDFIMTc4VjE0MUgxNFoiIGZpbGw9IndoaXRlIi8+CjxwYXRoIGQ9Ik0xNCAxMzBIMTc4VjEzMEgxNFoiIGZpbGw9IndoaXRlIi8+CjxwYXRoIGQ9Ik0xNCAxMTlIMTc4VjExOUgxNFoiIGZpbGw9IndoaXRlIi8+CjxwYXRoIGQ9Ik0xNCAxMDhIMTc4VjEwOEgxNFoiIGZpbGw9IndoaXRlIi8+CjxwYXRoIGQ9Ik0xNCA5N0gxNzhWOTdIMTRaIiBmaWxsPSJ3aGl0ZSIvPgo8L3N2Zz4K">
    <style>
        /* All previous CSS here - unchanged */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); padding: 40px; max-width: 800px; width: 100%; text-align: center; }
        .install-section { margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .install-btn, .download-app-btn { background: linear-gradient(135deg, #28a745, #20c997); color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-size: 1em; transition: background 0.3s ease; }
        .install-btn:hover, .download-app-btn:hover { background: linear-gradient(135deg, #218838, #1ea085); }
        .download-app-btn { background: linear-gradient(135deg, #ffc107, #e0a800); }
        .download-app-btn:hover { background: linear-gradient(135deg, #e0a800, #d39e00); }
        h1 { color: #333; margin-bottom: 30px; font-size: 2.5em; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .documents-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .document-card { background: #f8f9ff; border-radius: 15px; padding: 30px 20px; transition: transform 0.3s ease, box-shadow 0.3s ease; border: 2px dashed #ddd; position: relative; overflow: hidden; }
        .document-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); }
        .document-card.upload-mode { border-color: #667eea; background: linear-gradient(135deg, #f0f2ff, #e8eaff); }
        .document-card.stored-mode { border-color: #28a745; background: linear-gradient(135deg, #f8fff8, #e8ffe8); }
        .icon { font-size: 3em; margin-bottom: 15px; display: block; }
        .aadhar .icon { color: #ff6b6b; } .pan .icon { color: #4ecdc4; } .license .icon { color: #45b7d1; }
        .title { font-size: 1.2em; font-weight: bold; color: #333; margin-bottom: 10px; }
        .upload-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 12px 24px; border-radius: 25px; cursor: pointer; font-size: 1em; transition: background 0.3s ease; margin-top: 10px; }
        .upload-btn:hover { background: linear-gradient(135deg, #5a6fd8, #6a4190); }
        .file-input { display: none; }
        .preview { max-width: 100%; max-height: 200px; border-radius: 10px; margin: 10px auto; display: none; cursor: pointer; display: block; }
        .status { margin-top: 10px; font-size: 0.9em; font-weight: bold; }
        .status.upload-ready { color: #667eea; } .status.stored { color: #28a745; }
        .action-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .download-btn, .remove-btn { padding: 8px 16px; border: none; border-radius: 15px; cursor: pointer; font-size: 0.9em; transition: background 0.3s ease; text-decoration: none; display: inline-block; line-height: 1.2; }
        .download-btn { background: linear-gradient(135deg, #007bff, #0056b3); color: white; }
        .download-btn:hover { background: linear-gradient(135deg, #0056b3, #004085); }
        .remove-btn { background: #dc3545; color: white; }
        .remove-btn:hover { background: #c82333; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); }
        .modal img { margin: auto; display: block; max-width: 90%; max-height: 90%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .document-card { animation: fadeIn 0.5s ease; }
        @media (max-width: 600px) { .container { padding: 20px; } h1 { font-size: 2em; } .documents-grid { grid-template-columns: 1fr; } .action-buttons { flex-direction: column; gap: 5px; } .install-section { flex-direction: column; gap: 10px; } }
    </style>
</head>
<body>
    <div class="modal" id="modal" onclick="closeModal()">
        <img id="modal-img" src="" alt="Enlarged Preview">
    </div>

    <div class="container">
        <div class="install-section">
            <button class="install-btn" id="install-app" style="display: none;">📱 Install App to Device</button>
        </div>
        <h1>Secure Document Vault</h1>
        <p style="color: #666; margin-bottom: 30px;">Safely upload and manage your essential documents. Your files are stored securely in your browser.</p>
        
        <div class="documents-grid">
            <div class="document-card aadhar upload-mode" id="aadhar-card">
                <span class="icon">🆔</span>
                <div class="title">Upload Your Aadhar Card</div>
                <input type="file" class="file-input" id="aadhar-input" accept="image/*,.pdf">
                <button class="upload-btn" onclick="triggerUpload('aadhar')">Upload Document</button>
                <div class="status upload-ready">Ready to upload</div>
                <img class="preview" id="aadhar-preview" alt="Aadhar Preview" onclick="openModal(this.src)">
                <div class="action-buttons" id="aadhar-actions" style="display: none;">
                    <button class="download-btn" id="aadhar-download" onclick="downloadDocument('aadhar')">⬇️ Download</button>
                    <button class="remove-btn" id="aadhar-remove" onclick="removeDocument('aadhar')">❌ Remove</button>
                </div>
            </div>

            <div class="document-card pan upload-mode" id="pan-card">
                <span class="icon">💳</span>
                <div class="title">Upload Your PAN Card</div>
                <input type="file" class="file-input" id="pan-input" accept="image/*,.pdf">
                <button class="upload-btn" onclick="triggerUpload('pan')">Upload Document</button>
                <div class="status upload-ready">Ready to upload</div>
                <img class="preview" id="pan-preview" alt="PAN Preview" onclick="openModal(this.src)">
                <div class="action-buttons" id="pan-actions" style="display: none;">
                    <button class="download-btn" id="pan-download" onclick="downloadDocument('pan')">⬇️ Download</button>
                    <button class="remove-btn" id="pan-remove" onclick="removeDocument('pan')">❌ Remove</button>
                </div>
            </div>

            <div class="document-card license upload-mode" id="license-card">
                <span class="icon">🚗</span>
                <div class="title">Upload Your Driving License</div>
                <input type="file" class="file-input" id="license-input" accept="image/*,.pdf">
                <button class="upload-btn" onclick="triggerUpload('license')">Upload Document</button>
                <div class="status upload-ready">Ready to upload</div>
                <img class="preview" id="license-preview" alt="License Preview" onclick="openModal(this.src)">
                <div class="action-buttons" id="license-actions" style="display: none;">
                    <button class="download-btn" id="license-download" onclick="downloadDocument('license')">⬇️ Download</button>
                    <button class="remove-btn" id="license-remove" onclick="removeDocument('license')">❌ Remove</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // All previous JS here, but update SW registration to: navigator.serviceWorker.register('/sw.js')
        const documents = { aadhar: localStorage.getItem('aadhar') || null, pan: localStorage.getItem('pan') || null, license: localStorage.getItem('license') || null };
        function initDocuments() { Object.keys(documents).forEach(docType => { if (documents[docType]) { showStoredDocument(docType, documents[docType]); } }); }
        function triggerUpload(docType) { document.getElementById(`${docType}-input`).click(); }
        function openModal(src) { document.getElementById('modal').style.display = 'block'; document.getElementById('modal-img').src = src; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        function downloadDocument(docType) { const dataUrl = documents[docType]; if (!dataUrl) return; const link = document.createElement('a'); link.href = dataUrl; const extension = dataUrl.split(';')[0].split('/')[1] === 'pdf' ? 'pdf' : 'jpg'; link.download = `${docType}_card.${extension}`; document.body.appendChild(link); link.click(); document.body.removeChild(link); }
        function showStoredDocument(docType, dataUrl) { const card = document.getElementById(`${docType}-card`); const title = card.querySelector('.title'); const btn = card.querySelector('.upload-btn'); const status = card.querySelector('.status'); const preview = card.querySelector('.preview'); const actions = card.querySelector('.action-buttons'); title.textContent = `Your ${docType.charAt(0).toUpperCase() + docType.slice(1)} Card`; btn.style.display = 'none'; status.textContent = 'Document Stored Securely'; status.className = 'status stored'; preview.src = dataUrl; preview.style.display = 'block'; actions.style.display = 'flex'; card.className = 'document-card ' + docType + ' stored-mode'; }
        function removeDocument(docType) { localStorage.removeItem(docType); const card = document.getElementById(`${docType}-card`); const title = card.querySelector('.title'); const btn = card.querySelector('.upload-btn'); const status = card.querySelector('.status'); const preview = card.querySelector('.preview'); const actions = card.querySelector('.action-buttons'); title.textContent = `Upload Your ${docType.charAt(0).toUpperCase() + docType.slice(1)} Card`; btn.style.display = 'block'; status.textContent = 'Ready to upload'; status.className = 'status upload-ready'; preview.style.display = 'none'; actions.style.display = 'none'; card.className = 'document-card ' + docType + ' upload-mode'; documents[docType] = null; }
        // PWA Install - unchanged
        let deferredPrompt; const installBtn = document.getElementById('install-app'); window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'inline-block'; }); installBtn.addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') { deferredPrompt = null; installBtn.style.display = 'none'; } } });
        // Service Worker - now external
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').then((registration) => { console.log('SW registered: ', registration); }).catch((error) => { console.log('SW registration failed: ', error); }); }
        document.addEventListener('DOMContentLoaded', function() { initDocuments(); ['aadhar', 'pan', 'license'].forEach(docType => { document.getElementById(`${docType}-input`).addEventListener('change', function(e) { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = function(e) { const dataUrl = e.target.result; localStorage.setItem(docType, dataUrl); documents[docType] = dataUrl; showStoredDocument(docType, dataUrl); }; reader.readAsDataURL(file); } }); }); });
    </script>
</body>
</html>
